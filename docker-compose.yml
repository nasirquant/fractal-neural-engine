version: '3.8'

services:
  # =============================================================================
  # Redis - State persistence, checkpoints, and caching
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: fnse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fnse-network

  # =============================================================================
  # FNSE API Server - FastAPI application
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fnse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    env_file:
      - .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./skills:/app/skills
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fnse-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =============================================================================
  # Simulation Worker - Background worker for long-running simulations
  # =============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: fnse-worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - WORKER_MODE=true
    env_file:
      - .env
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
      - ./skills:/app/skills
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fnse-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    command: ["python", "run_simulation.py", "--help"]

  # =============================================================================
  # Grafana - Monitoring and visualization (optional)
  # =============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: fnse-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - fnse-network

  # =============================================================================
  # Prometheus - Metrics collection (optional)
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: fnse-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - fnse-network

volumes:
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  fnse-network:
    driver: bridge
    name: fnse-network