global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fnse'
    environment: 'production'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FNSE API metrics
  - job_name: 'fnse-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # FNSE Worker metrics (if exposing metrics)
  - job_name: 'fnse-worker'
    static_configs:
      - targets: ['worker:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis metrics via redis-exporter (if running)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Node exporter for system metrics (if running)
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # cAdvisor for container metrics (if running)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']

# Alerting rules
rule_files:
  - 'alerts/*.yml'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']